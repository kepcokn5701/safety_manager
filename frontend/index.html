<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEPCO 안전관리 시스템 - 폭염 모니터링</title>

    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1a5276">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="안전관리">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.svg">

    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- ── 헤더 ── -->
<header class="header">
    <h1>KEPCO 안전관리 시스템</h1>
    <div class="header-right">
        <button id="push-btn" class="btn btn-sm" onclick="togglePushSubscription()" style="background:rgba(255,255,255,0.2);color:white;border:1px solid rgba(255,255,255,0.3)">알림 허용</button>
        <span class="status-dot"></span>
        <span>모니터링 가동 중</span>
        <span id="current-time"></span>
    </div>
</header>

<!-- ── 메인 ── -->
<div class="main-container">

    <!-- 상태 배너 -->
    <div id="alert-banner" class="alert-banner safe">
        <div class="alert-icon">O</div>
        <div class="alert-content">
            <h2>시스템 시작 중...</h2>
            <p>작업현장을 등록하면 폭염 모니터링이 시작됩니다.</p>
        </div>
    </div>

    <!-- 단계 인디케이터 -->
    <div id="stage-indicator"></div>

    <!-- 카드 그리드 -->
    <div class="card-grid">

        <!-- 현재 날씨 -->
        <div class="card">
            <div class="card-header">
                <h3>현재 날씨</h3>
                <button class="btn btn-primary btn-sm" onclick="state.selectedSiteId && loadWeather(state.selectedSiteId)">새로고침</button>
            </div>
            <div class="card-body" id="weather-content">
                <p style="color:var(--text-secondary)">작업현장을 선택하세요.</p>
            </div>
        </div>

        <!-- 조치사항 -->
        <div class="card">
            <div class="card-header">
                <h3>조치사항 (고용노동부 기준)</h3>
            </div>
            <div class="card-body" id="actions-content">
                <p style="color:var(--text-secondary)">현재 특별 조치사항 없음</p>
            </div>
        </div>

        <!-- 작업현장 목록 -->
        <div class="card">
            <div class="card-header">
                <h3>작업현장</h3>
                <button class="btn btn-primary btn-sm" onclick="openModal('site-modal')">+ 현장 등록</button>
            </div>
            <div class="card-body" id="site-list">
                <p style="color:var(--text-secondary)">로딩 중...</p>
            </div>
        </div>

        <!-- 알림 통계 -->
        <div class="card">
            <div class="card-header">
                <h3>알림 통계 (최근 7일)</h3>
                <button class="btn btn-primary btn-sm" onclick="triggerMonitoring()">수동 점검</button>
            </div>
            <div class="card-body" id="stats-content">
                <p style="color:var(--text-secondary)">로딩 중...</p>
            </div>
        </div>

        <!-- 알림 이력 -->
        <div class="card" style="grid-column: 1 / -1">
            <div class="card-header">
                <h3>최근 알림 이력</h3>
                <button class="btn btn-primary btn-sm" onclick="openModal('worker-modal')">+ 작업자 등록</button>
            </div>
            <div class="card-body" id="alert-history">
                <p style="color:var(--text-secondary)">로딩 중...</p>
            </div>
        </div>

    </div>
</div>

<!-- ── 작업현장 등록 모달 ── -->
<div class="modal-overlay" id="site-modal">
    <div class="modal">
        <div class="modal-header">
            <h3>작업현장 등록</h3>
            <button class="modal-close" onclick="closeModal('site-modal')">&times;</button>
        </div>
        <div class="modal-body">
            <form onsubmit="submitSite(event)">
                <div class="form-group">
                    <label>현장명 *</label>
                    <input type="text" name="site_name" required placeholder="예: 강남변전소 증설공사">
                </div>
                <div class="form-group">
                    <label>주소</label>
                    <input type="text" name="site_address" placeholder="예: 서울시 강남구 역삼동 123">
                </div>
                <div class="form-group">
                    <label>위도 * <button type="button" class="btn btn-sm" onclick="getCurrentLocation()" style="margin-left:8px;padding:2px 8px;font-size:11px">현재 위치</button></label>
                    <input type="number" step="0.000001" name="site_lat" id="site_lat" required placeholder="37.5665">
                </div>
                <div class="form-group">
                    <label>경도 *</label>
                    <input type="number" step="0.000001" name="site_lng" id="site_lng" required placeholder="126.9780">
                </div>
                <div class="form-group">
                    <label>작업강도</label>
                    <select name="site_intensity">
                        <option value="light">경작업 (계기점검, 감시 등)</option>
                        <option value="moderate" selected>중등작업 (배전선로 점검 등)</option>
                        <option value="heavy">중작업 (전주작업, 케이블 포설 등)</option>
                        <option value="very_heavy">초중작업 (굴착, 전주 건주 등)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">등록</button>
            </form>
        </div>
    </div>
</div>

<!-- ── 작업자 등록 모달 ── -->
<div class="modal-overlay" id="worker-modal">
    <div class="modal">
        <div class="modal-header">
            <h3>작업자 등록</h3>
            <button class="modal-close" onclick="closeModal('worker-modal')">&times;</button>
        </div>
        <div class="modal-body">
            <form onsubmit="submitWorker(event)">
                <div class="form-group">
                    <label>이름 *</label>
                    <input type="text" name="worker_name" required placeholder="홍길동">
                </div>
                <div class="form-group">
                    <label>전화번호 *</label>
                    <input type="tel" name="worker_phone" required placeholder="010-1234-5678">
                </div>
                <div class="form-group">
                    <label>소속 부서</label>
                    <input type="text" name="worker_dept" placeholder="배전건설부">
                </div>
                <div class="form-group">
                    <label>작업반</label>
                    <input type="text" name="worker_team" placeholder="1공구 3반">
                </div>
                <div class="form-group" style="display:flex;align-items:center;gap:8px">
                    <input type="checkbox" name="worker_vulnerable" id="worker_vulnerable">
                    <label for="worker_vulnerable" style="margin:0">취약 작업자 (고령자, 기저질환자 등)</label>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">등록</button>
            </form>
        </div>
    </div>
</div>

<!-- ── 앱 설치 배너 ── -->
<div id="install-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#1a5276,#2980b9);color:white;padding:16px 20px;z-index:999;box-shadow:0 -4px 20px rgba(0,0,0,0.3)">
    <div style="max-width:600px;margin:0 auto;display:flex;align-items:center;gap:16px">
        <img src="/static/icons/icon-72.svg" alt="" style="width:48px;height:48px;border-radius:12px">
        <div style="flex:1">
            <div style="font-weight:700;font-size:15px">KEPCO 안전관리 앱 설치</div>
            <div style="font-size:13px;opacity:0.85">홈 화면에 추가하면 앱처럼 사용할 수 있습니다</div>
        </div>
        <button onclick="installApp()" class="btn btn-sm" style="background:white;color:#1a5276;font-weight:700;white-space:nowrap">설치</button>
        <button onclick="dismissInstall()" style="background:none;border:none;color:white;font-size:20px;cursor:pointer;padding:4px">&times;</button>
    </div>
</div>

<script src="/static/js/app.js"></script>
<script>
    // 시계 업데이트
    function updateClock() {
        const el = document.getElementById('current-time');
        if (el) el.textContent = new Date().toLocaleString('ko-KR');
    }
    updateClock();
    setInterval(updateClock, 1000);
</script>

</body>
</html>
