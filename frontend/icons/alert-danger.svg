<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF5350"/>
      <stop offset="100%" stop-color="#D32F2F"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- skull/danger symbol -->
  <g transform="translate(96,80)">
    <!-- outer circle -->
    <circle cx="0" cy="0" r="48" fill="#fff" opacity="0.95"/>
    <!-- X mark -->
    <g stroke="#D32F2F" stroke-width="12" stroke-linecap="round">
      <line x1="-20" y1="-20" x2="20" y2="20"/>
      <line x1="20" y1="-20" x2="-20" y2="20"/>
    </g>
    <!-- flame top -->
    <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <path d="M-25,-58 Q-20,-72 -12,-58 Q-6,-46 0,-62"/>
      <path d="M0,-62 Q6,-46 12,-58 Q20,-72 25,-58"/>
      <path d="M-8,-70 Q0,-85 8,-70"/>
    </g>
  </g>
  <text x="96" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="900" fill="#fff">DANGER</text>
</svg>
